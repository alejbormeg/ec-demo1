spring.application.name=ec-demo1-front-office
server.port=${SERVER_PORT:8128}
mateu.debug=false

# PostgreSQL: the stays the integration writes must outlive a restart. schema.sql creates what is
# missing; FrontOfficeSeeder fills the demo's inventory and guests only into an empty database.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/front_office}
spring.datasource.username=${DB_USERNAME:workflow}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:6}
spring.sql.init.mode=always

# Keycloak: keys over the cluster network; the issuer as the token carries it (the public URL).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/ec-demo1/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://auth.ec1.mateu.io/realms/ec-demo1}

# The chain's MDM, for reads: the reservation's links, and the customer a scanned pax already is. The
# desk's changes and scanned documents go there by Kafka (customer-commands).
frontoffice.mdm-url=${MDM_URL:}
# The customer history (customer-history): the summary of a customer's stays in the chain the desk
# shows of a customer it recognises at check-in (GET /customers/{code}/summary). Empty: no history.
frontoffice.history-url=${HISTORY_URL:}
# Riu Class, the loyalty service: the tier and points of a customer the desk recognises. Empty: none
# shown (the headers keep the guest's own figures).
frontoffice.loyalty-url=${LOYALTY_URL:}
# The master of partners (the ERP): the companies a stay is billed to, and their data corrected at the desk.
frontoffice.erp-url=${ERP_URL:}
# The audit service: a reservation's «Historial» (GET /audit), inside the cluster. Empty: no history.
frontoffice.audit-url=${AUDIT_URL:}
frontoffice.hotel=${FRONT_OFFICE_HOTEL:MRU01}
# Its name, as the suite's Hotel selector shows it (the CRS's name of MRU01).
frontoffice.hotel-name=${FRONT_OFFICE_HOTEL_NAME:Riu Demo Mauricio}
# The hotel's country (ISO), where a registration rule of a country applies. No master has it yet
# (the CRS's catalogue has no country): the registration-rules service is told the same.
frontoffice.hotel-country=${FRONT_OFFICE_HOTEL_COUNTRY:MU}
# The PMS property this front office consumes (the pms-fo integration's): its stays and its catalogue
# arrive by Kafka (front-office-commands); commands about another property are not this one's.
frontoffice.pms-hotel=${FRONT_OFFICE_PMS_HOTEL:XMAR}
# The currency of the folio's amounts — the PMS property's (the stays' totals are the PMS's). Said on
# every charge that goes onto the PMS's folio (front-office-events); empty, the property's own.
frontoffice.currency=${FRONT_OFFICE_CURRENCY:}
# What Opera's housekeeping must say of a vacant room for the desk to be offered it as ready: XMAR
# assigns inspected rooms only (FOF00081 «Room … is Clean (CL)» on a clean one). Comma-separated:
# Clean,Inspected for a property that does not inspect.
frontoffice.pms-ready-statuses=${FRONT_OFFICE_PMS_READY_STATUSES:Inspected}
# The data plane's console: a stay links to its CRS booking and to its customers there.
frontoffice.console-url=${CONSOLE_URL:https://ec1.mateu.io}
# The CRS's adapter: walk-ins are booked there, and the demo scanner reads the booking of the pax it
# scans.
frontoffice.crs-integration-url=${CRS_INTEGRATION_URL:}
# The PMS's connector, for one query a screen needs now: which rooms of a type Opera has clean and
# free, to pick at the check-in. What the desk does goes up to the PMS by Kafka (front-office-events).
frontoffice.pms-integration-url=${PMS_INTEGRATION_URL:}
# What the invoice links («Abrir factura») are signed with; empty, a key of this process's own (links
# stop working when it restarts).
frontoffice.link-secret=${LINK_SECRET:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Traces to Tempo, as the engine's. Sampled at 0 unless TRACING_SAMPLING says otherwise (1.0 in the
# cluster); the service name comes from OTEL_SERVICE_NAME, set in the manifest. Metrics stay with
# Prometheus: the starter's OTLP metrics export is off.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false

# The MCP server: the desk's tools for the reception agent (ia-agent), over SSE as the other services'.
spring.ai.mcp.server.name=front-office
spring.ai.mcp.server.version=1.0.0
# SSE, not Spring AI 2.0's default (streamable HTTP): ia-agent connects to every server over SSE, and a
# tool call arrives on /mcp/message?sessionId=… — one session per prompt, which the confirmations use.
spring.ai.mcp.server.protocol=SSE
# The SSE connections must not expire.
spring.mvc.async.request-timeout=-1
# Where the agent's audited actions (topic `audit`) and the commands to other services go
# (customer-commands) and what its desk did, for the PMS (front-office-events); empty, they stay in
# their outboxes. It is also where the front
# office takes what others tell it: the PMS's stays and catalogue (front-office-commands) and the MDM's
# customers for the kardex (customers).
frontoffice.kafka-brokers=${KAFKA_BROKERS:}
# The shared outbox (supporting/messaging): relayed every second, through the producer KafkaRelay builds
# where there is a broker. Its tables are the library's (outbox_message, inbox_entry); LegacyOutboxes
# carries over what the front office's own ones still held.
messaging.outbox.interval=1s

# Forced check-ins («Check-in incompleto»): the documents a forced check-in lacks are due this long after
# the arrival (Spain's traveller registration: 24 h); past it, reception is told once through the
# communication service (notifications, type CHECK_IN_INCOMPLETE). Checked every check-interval. The
# notice links to the stay on the front office's own URL, when it is given.
frontoffice.forced-check-in.document-deadline=${FORCED_CHECKIN_DOCUMENT_DEADLINE:PT24H}
frontoffice.forced-check-in.check-interval=${FORCED_CHECKIN_CHECK_INTERVAL:PT1M}
frontoffice.front-office-url=${FRONT_OFFICE_URL:}

# The agents' read-only SQL (supporting/agent-sql, doc/src/content/docs/ia/datos-del-agente.md): the views of
# agent-sql/views.sql, read as a login that can read only those. Empty in the tests (H2), where it
# runs on the service's own DataSource behind the SQL guard alone.
agent-sql.username=${AGENT_DB_USERNAME:}
agent-sql.password=${AGENT_DB_PASSWORD:}
