# Explicitly installed synthetic fixtures, never part of the normal deployment.
apiVersion: apps/v1
kind: Deployment
metadata: { name: workflow-fixtures, namespace: ec-demo1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: workflow-fixtures } }
  template:
    metadata: { labels: { app: workflow-fixtures } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: protocols
          image: python:3.12-slim
          command: [python3, /fixture/fixture_server.py, --ledger, /data/effects.sqlite]
          env: [{ name: FIXTURE_UNCERTAIN_WRITE, value: "false" }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: code, mountPath: /fixture, readOnly: true }, { name: data, mountPath: /data }]
      volumes:
        - name: code
          configMap: { name: workflow-fixture-code }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: workflow-model-mock, namespace: ec-demo1 }
spec: { selector: { app: workflow-fixtures }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: workflow-embedding-mock, namespace: ec-demo1 }
spec: { selector: { app: workflow-fixtures }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: workflow-mcp-mock, namespace: ec-demo1 }
spec: { selector: { app: workflow-fixtures }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: workflow-rag-mock, namespace: ec-demo1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: workflow-rag-mock } }
  template:
    metadata: { labels: { app: workflow-rag-mock } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_DB, value: synthetic_workflow }
            - { name: POSTGRES_USER, value: synthetic_workflow }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: workflow-fixture-credentials, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, synthetic_workflow, -d, synthetic_workflow] } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: database, mountPath: /var/lib/postgresql/data }, { name: seed, mountPath: /docker-entrypoint-initdb.d }]
      volumes:
        - name: database
          emptyDir: {}
        - name: seed
          configMap: { name: workflow-fixture-seed }
---
apiVersion: v1
kind: Service
metadata: { name: workflow-rag-mock, namespace: ec-demo1 }
spec: { selector: { app: workflow-rag-mock }, ports: [{ port: 5432, targetPort: 5432 }] }
