server:
  port: 8126

spring:
  application:
    name: ec-demo1-integrations

  ai:
    mcp:
      server:
        name: integrations
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  cloud:
    function:
      definition: consumeWorkerEvent;consumePmsReservations;consumeFrontOfficeEvents
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
          # Every consumer continues the trace its record carries (traceparent header), and every
          # record sent carries the trace it was sent in: the engine's tasks run inside the process's
          # trace.
          enable-observation: true
        bindings:
          outboxUpstream:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          notifications:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          audit:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          resolutions:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          mappingCommands:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          partnerCommands:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          projectionRequests:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          frontOfficeCommands:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
                # The PMS's catalogue goes whole: some hundred KB with every room of a big property.
                max.request.size: 5242880
      bindings:
        # IN: the engine's tasks for the integrations — the steps of «alta-integracion» and
        # «alta-integracion-fo». consumeWorkerEvent is the engine's worker runtime (worker-kafka): it
        # runs each task by its contract, <id>@<version>, on the handler registered for it
        # (worker.IntegrationsTasks), and answers the engine. The group is the one the hand-written
        # consumer had, so it goes on from the same offsets.
        consumeWorkerEvent-in-0:
          destination: integrations
          group: ec-demo1-integrations-worker
          consumer:
            # «integrations» has one partition, and an onboarding's steps come one after another.
            concurrency: 1
        # OUT: replies to the engine; and, through the outbox, the start of an onboarding, the
        # messages that open its gates, and notifications.
        upstream:
          destination: upstream
        outboxUpstream:
          destination: upstream
        notifications:
          destination: notifications
        # OUT, through the outbox: every auditable action a person takes here (HLA F016).
        audit:
          destination: audit
        # OUT, through the outbox: what a notification asked for is no longer waiting — the inbox closes it.
        resolutions:
          destination: notification-resolutions
        # OUT, through the outbox: the commands this service sends others — never over HTTP. The
        # mapping (equivalences, the agent's proposal, causes, partner profiles), the master of
        # partners (resync, import), the CRS adapter (the backfill's projections). Each consumer takes
        # a command once, by its id.
        mappingCommands:
          destination: mapping-commands
        partnerCommands:
          destination: partner-commands
        projectionRequests:
          destination: projection-requests
        # OUT, through the outbox: the PMS's catalogue for the hotel's front office (pms-fo integration).
        frontOfficeCommands:
          destination: front-office-commands
        # IN: the connector wrote a reservation into the PMS; a front office fed from that property
        # projects it (pms-fo integration).
        consumePmsReservations-in-0:
          destination: pms-reservations
          group: ec-demo1-integrations-pms-reservations
          # Retried until it goes: after the binder's default three attempts the event would be
          # dropped (there is no DLQ); the process key's dedup in the engine makes redeliveries harmless.
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # IN: what a front office's desk did — check-in, check-out, no-show; the PMS records it
        # (pms-fo: «registrar-checkin», «registrar-checkout», «registrar-no-show-pms»).
        consumeFrontOfficeEvents-in-0:
          destination: front-office-events
          group: ec-demo1-integrations-front-office-events
          # Retried until it goes: after the binder's default three attempts the event would be
          # dropped (there is no DLQ); the process key's dedup in the engine makes redeliveries harmless.
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/integrations}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9192}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

# No defaults for the crypto key or the Opera secret: both come from a Secret. Without the key no
# connection can be stored; the rest of the chain's connection is what a new integration starts from
# and what lists the tenant's properties.
integrations:
  opera:
    gateway-url: ${OPERA_GATEWAY_URL:}
    app-key: ${OPERA_APP_KEY:}
    client-id: ${OPERA_CLIENT_ID:}
    client-secret: ${OPERA_CLIENT_SECRET:}
    enterprise-id: ${OPERA_ENTERPRISE_ID:}
  crs-integration-url: ${CRS_INTEGRATION_URL:http://localhost:8121}
  pms-integration-url: ${PMS_INTEGRATION_URL:http://localhost:8123}
  mapping-url: ${MAPPING_URL:http://localhost:8122}
  partners-url: ${ERP_URL:http://localhost:8120}
  console-url: ${CONSOLE_URL:https://console.ec1.mateu.io}
  crypto-key: ${INTEGRATIONS_CRYPTO_KEY:}
  gate-check: ${GATE_CHECK:5s}
  recheck: ${GATE_RECHECK:30s}
  backfill-per-tick: ${BACKFILL_PER_TICK:20}
  backfill-tick: ${BACKFILL_TICK:2s}
  activation-window-days: ${ACTIVATION_WINDOW_DAYS:30}
  # The hotel's front office, fed from the PMS (pms-fo integrations): where a new one starts from.
  front-office-url: ${FRONT_OFFICE_URL:http://localhost:8128}
  front-office:
    # How far ahead of today a front office is backfilled and its reservations polled for changes.
    horizon-days: ${FO_HORIZON_DAYS:60}
    # How often the PMS is asked what changed in it (OHIP's search has no «modified since»).
    poll: ${FO_POLL:60s}
  mapping:
    # Whether the mapping gate asks the mapping agent on its own, or leaves a person a notice to ask it
    # from Mapping → Dictionary (the demo, where asking it is a step shown live).
    ask-agent: ${INTEGRATIONS_MAPPING_ASK_AGENT:true}
  # The external APIs' usage in the consoles' header: each service that calls Salesforce or Opera says
  # its own at GET /usage/{api}; comma-separated when more than one calls the same API. Inside the cluster.
  usage:
    salesforce: ${USAGE_SALESFORCE_URLS:${CUSTOMER_MDM_URL:http://localhost:8127}}
    opera: ${USAGE_OPERA_URLS:${PMS_INTEGRATION_URL:http://localhost:8123}}
    timeout: ${USAGE_TIMEOUT:2s}
    cache: ${USAGE_CACHE:15s}
  # The demo's administration: the control plane's «Demo» page (/_demo) and the steps of reset-demo this
  # service serves (purge-engine, check-demo-health, notify-reset-result).
  demo:
    # The engine's database, read for the reset-demo runs and emptied by purge-engine. Empty: no engine.
    engine-db-url: ${ENGINE_DB_URL:}
    engine-db-username: ${ENGINE_DB_USERNAME:${DB_USERNAME:workflow}}
    engine-db-password: ${ENGINE_DB_PASSWORD:${DB_PASSWORD:}}
    # Where the engine's process pages are (/workflow/processes/<id>).
    data-console-url: ${DATA_CONSOLE_URL:https://ec1.mateu.io}
    booking-url: ${BOOKING_URL:http://localhost:8108}
    # What check-demo-health asks after a reset: name=url, each a Spring Boot health.
    health: ${DEMO_HEALTH:booking=http://localhost:8108/actuator/health/readiness}
    health-timeout: ${DEMO_HEALTH_TIMEOUT:3s}

springdoc:
  packages-to-scan: io.mateu.ecdemo1.integrations.rest

management:
  # Traces to Tempo, as the engine's. Sampled at 0 unless TRACING_SAMPLING says otherwise (1.0 in
  # the cluster); the service name comes from OTEL_SERVICE_NAME, set in the manifest.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
