server:
  port: 8190
  # Compress what the consoles download. No backend behind this gateway compresses (none sets
  # server.compression) and ingress-nginx is not configured to either, so until this every
  # console shipped its JavaScript as-is: 777 KB for Redwood's app bundle, 885 KB for Vaadin's.
  # Here rather than in each app because every console's every response passes through here, and
  # the hop from the backends to this pod stays inside the cluster where size does not matter.
  # Responses a backend already compressed pass through untouched (Content-Encoding is set).
  # text/event-stream is deliberately absent: compressing a stream buffers it, and the chat and the
  # process logs would arrive in lumps.
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types:
      - text/html
      - text/css
      - text/plain
      - text/xml
      - text/javascript
      - application/javascript
      - application/x-javascript
      - application/json
      - application/xml
      - image/svg+xml
      - application/manifest+json
      - font/ttf
      - font/otf
      - application/vnd.ms-fontobject

spring:
  application:
    name: ec-demo1-gateway

  cloud:
    gateway:
      routes:
        # The workflow-graph web component is served from an absolute path, so it needs a route
        # of its own or the definition viewer renders an empty box. Public — see SecurityConfig.
        # The engine's own static assets — workflow-graph.js among them, which is what draws a
        # definition's graph and a process's.
        #
        # All FOUR consoles, not just the demo ones. This route named only the demo host until the
        # definitions screen moved to the control console, and then the graph silently stopped
        # drawing there: the element was on the page, its script 404'd, and a custom element whose
        # definition never arrives renders as nothing at all. Any screen that moves between planes
        # has to bring the assets it loads with it, and this is the one that did not.
        - id: eventconductor-assets
          uri: ${ORCHESTRATOR_URL:http://orchestrator:8105}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io},${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/eventconductor/**

        # Git webhooks. These are NOT under /_workflow and /_forms — those prefixes are the
        # Mateu UI namespaces, while the webhook receivers are plain REST controllers at
        # /workflow/webhooks/{provider} and /forms/webhooks/{provider}. Without a route of
        # their own they fall through to the shell's catch-all, and GitHub gets a login page.
        #
        # Public, necessarily: GitHub cannot hold a Keycloak token. They authenticate by
        # HMAC-SHA256 over the body instead — which is only true while the engine has a
        # webhook secret configured. Blank means it verifies nothing.
        - id: workflow-webhooks
          uri: ${ORCHESTRATOR_URL:http://orchestrator:8105}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/workflow/webhooks/**

        - id: forms-webhooks
          uri: ${FORMS_URL:http://forms:8106}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/forms/webhooks/**

        # The IDE uses the REST API, not the Mateu UI namespace below. Preserve the full
        # path and caller's bearer token. SecurityConfig requires the workflow admin role;
        # starting unpublished documents still requires the engine's separate opt-in flag.
        - id: workflow-execution-api
          uri: ${ORCHESTRATOR_URL:http://orchestrator:8105}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/workflow/api/**

        - id: orchestrator
          uri: ${ORCHESTRATOR_URL:http://orchestrator:8105}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_workflow/**

        - id: forms
          uri: ${FORMS_URL:http://forms:8106}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_forms/**

        # A person's inbox — notifications and tasks — in every shell: the data plane's and the
        # control console's. Filtered by the caller's roles in the service; only signed-in users.
        #
        # The service's own path typed in the address bar (/_inbox) is sent to the shell's route
        # for the inbox (/inbox/pending), like /_api-usage/apis below: a GET with no token, which
        # the rule on /_inbox refuses with a 401 — a blank page in both renderers. First, so it
        # wins over the route below.
        - id: inbox-page
          uri: no://op
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io},${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_inbox,/_inbox/
            - Method=GET
          filters:
            - RedirectTo=302, /inbox/pending
        - id: inbox
          uri: ${COMMUNICATION_URL:http://communication-service:8125}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io},${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_inbox/**

        # How much of Salesforce and Opera is spent — the page behind the home pages' tiles, in every shell
        # like the inbox — served by integrations-service, which asks the services that call them.
        # Only the screens: the services' own /usage endpoints stay inside the cluster.
        #
        # A browser that opens the page by the service's own path (/_api-usage/apis) is sent to the
        # shell's route for it (/usage/apis): typed in the address bar, the service path is a GET with
        # no token, which the rule on /_api-usage refuses — a blank page. The shell's route loads it
        # after the login, like any other. First, so it wins over the route below.
        - id: api-usage-page
          uri: no://op
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io},${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_api-usage/apis
            - Method=GET
          filters:
            - RedirectTo=302, /usage/apis
        - id: api-usage
          uri: ${INTEGRATIONS_URL:http://integrations-service:8126}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io},${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_api-usage/**
        # The demo's banner, «Simulación: Opera no responde» while the control plane's Demo page has an
        # Opera outage simulated, in every console's header — the front office's too. Signed in; it says
        # nothing else. The Demo page itself (/_demo) is the control host's alone, below.
        - id: demo-banner
          uri: ${INTEGRATIONS_URL:http://integrations-service:8126}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io},${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io},${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/_demo-banner/**

        # The four demo services. Each one's Mateu UI is served under the prefix its @UI
        # annotation declares, and the shell names the same prefix in a RemoteMenu — so a path
        # here, a field in ShellHome and the @UI value have to agree or the menu renders empty.
        - id: booking
          uri: ${BOOKING_URL:http://booking:8108}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_booking/**

        # The CRS-PMS integration PoC (docs/poc-acl): the ERP, the master of partners, and the double of
        # Opera's API the integration writes to instead of a real tenant.
        - id: erp
          uri: ${ERP_URL:http://erp:8120}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_erp/**

        # Clientes: the customer master's business face — finding a customer, and its data, systems,
        # reservations and change requests — served by the MDM under a second @UI of its own, on the
        # data plane's hosts. Its technical screens stay on the control hosts, under /_mdm.
        - id: customers
          uri: ${CUSTOMER_MDM_URL:http://customer-mdm-service:8127}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_customers/**

        # Avisos: the reception notices of a customer, a reservation or a partner — the business's, so on
        # the data plane's hosts only. Only its screens: its REST API (/notices) and its MCP server stay
        # inside the cluster, for the agents.
        - id: notices
          uri: ${NOTICES_URL:http://notices:8131}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_notices/**

        # Historial de clientes: a customer's stays in the chain, for the head office — the business's,
        # so on the data plane's hosts only. Only its screens: its REST API (/customers/{code}/summary, which
        # the front office reads) and its MCP server stay inside the cluster.
        - id: customer-history
          uri: ${CUSTOMER_HISTORY_URL:http://customer-history:8133}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_history/**

        # Riu Class: the loyalty programme's members, tiers, points and accruals (a demo service) — the
        # business's, so on the data plane's hosts only. Only its screens: its REST API (/members, which the
        # front office reads) and its MCP server stay inside the cluster.
        - id: loyalty
          uri: ${LOYALTY_URL:http://loyalty:8134}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_loyalty/**

        # Registro de huéspedes: the registration rules — governance, so on the control hosts only, and
        # only its screens: its REST API (/rules) and its MCP server stay inside the cluster.
        - id: registration-rules
          uri: ${REGISTRATION_RULES_URL:http://registration-rules:8132}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_registration-rules/**

        # A booking's journey across the chain, drawn from its traces in Tempo by journey-service:
        # the data plane's screen behind "Ver recorrido". Only the screens — the service reads Tempo
        # from inside the cluster; the browser never talks to Tempo.
        - id: journey
          uri: ${JOURNEY_URL:http://journey-service:8130}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_journey/**

        - id: content
          uri: ${CONTENT_URL:http://content:8104}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/_content/**

        # Users moved to the control console: on the CONTROL host now, not the demo host, because
        # administering access is a control-plane concern. Behind the ai-admin role, like the IA
        # catalogues — see SecurityConfig.
        - id: users
          uri: ${USERS_URL:http://users:8102}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_users/**

        # The chat agent, at the path Mateu's @AI client posts to. Not a Mateu UI and so not a
        # /_ prefix: the shell's chat panel calls /ai/api/agent/stream directly.
        #
        # One ia-agent serves every console; the host is what says which console a prompt comes
        # from, and only the gateway knows it. So each console's route stamps it: X-Agent-Channel
        # (data-plane, control-plane, front-office) — a condition the control plane's routes may key
        # on, since the screens cannot tell the consoles apart (both have a /mapping) — and
        # X-Default-Agent, the agent that answers there unless a route picks another.
        # SetRequestHeader replaces: whatever a browser sent under these names never reaches the agent.
        - id: ia-agent
          uri: ${IA_AGENT_URL:http://ia-agent:8095}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/ai/**
          filters:
            - SetRequestHeader=X-Agent-Channel, data-plane
            - SetRequestHeader=X-Default-Agent, ${DATA_PLANE_AGENT:console-agent}

        # The control console's chat: the same agent pod, stamped as the control plane's console.
        - id: control-plane-agent
          uri: ${IA_AGENT_URL:http://ia-agent:8095}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/ai/**
          filters:
            - SetRequestHeader=X-Agent-Channel, control-plane
            - SetRequestHeader=X-Default-Agent, ${CONTROL_PLANE_AGENT:control-plane-agent}

        # Agent-to-agent (/a2a/{agentId}) is for agents inside the cluster calling each other, never
        # for a browser. Nothing above routes it to ia-agent anyway; this says so on every host, so
        # a later catch-all towards ia-agent cannot publish it by accident.
        - id: a2a-not-public
          uri: no://op
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io},${RW_CONSOLE_HOST:rw.ec1.mateu.io},${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io},${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/a2a/**
          filters:
            - SetStatus=404

        # Catch-all for the demo console, and therefore last among its routes: the shell's
        # bootstrap page, its /mateu/** endpoint and its static assets.
        # The catch-all is per host, and it is the ONLY thing that differs between the Vaadin
        # console and the Redwood one: same gateway, same backends, a different shell serving the
        # page. Everything above matches both hosts, so a RemoteMenu resolves identically on each
        # and the renderer is decided by whichever shell the browser loaded.
        - id: shell
          uri: ${SHELL_URL:http://shell:8101}
          predicates:
            - Host=${CONSOLE_HOST:ec1.mateu.io}
            - Path=/**

        - id: shell-redwood
          uri: ${SHELL_REDWOOD_URL:http://shell-redwood:8102}
          predicates:
            - Host=${RW_CONSOLE_HOST:rw.ec1.mateu.io}
            - Path=/**

        # ── The hotel's front office, on a host of its own (front.ec1.mateu.io) ────────────
        #
        # Its UI logs in with Keycloak, as the demo console does. Its /api is where the integration
        # writes reservations, from inside the cluster; it is not routed from here — answered with a
        # 404 before the catch-all can take it.
        - id: front-office-api-not-public
          uri: no://op
          predicates:
            - Host=${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/api/**
          filters:
            - SetStatus=404

        # Its MCP server (/sse, /mcp/**) is the reception agent's, reached inside the cluster by
        # ia-agent: not from here either.
        - id: front-office-mcp-not-public
          uri: no://op
          predicates:
            - Host=${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/sse,/mcp/**
          filters:
            - SetStatus=404

        # Its /demo is the demo's seeding (known customers: documents, Riu Class numbers, stay
        # history), called by deploy/demo/ec1.py from inside the cluster, with no token: not from here.
        - id: front-office-demo-not-public
          uri: no://op
          predicates:
            - Host=${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/demo/**
          filters:
            - SetStatus=404

        # Its chat: the same path as the consoles' (Mateu's @AI client posts to /ai/api/agent/stream),
        # to the same agent pod, stamped as the front office's console — its routes do not share a
        # prefix a routing rule could key on, and its host is what says the question comes from the
        # front desk.
        - id: front-office-agent
          uri: ${IA_AGENT_URL:http://ia-agent:8095}
          predicates:
            - Host=${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/ai/**
          filters:
            - SetRequestHeader=X-Agent-Channel, front-office
            - SetRequestHeader=X-Default-Agent, ${FRONT_OFFICE_AGENT:reception-agent}

        # Web Push at the front desk: the same script, service worker and subscriptions as the
        # consoles' — the push paths of the inbox and nothing else of it (the desk has no inbox). A
        # browser that subscribes from this host is the front desk's: communication-service tells it
        # only what the recipients push to the desk (FRONT_DESK_PUSH).
        - id: front-office-push
          uri: ${COMMUNICATION_URL:http://communication-service:8125}
          predicates:
            - Host=${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/_inbox/push/**

        - id: front-office
          uri: ${FRONT_OFFICE_URL:http://front-office:8128}
          predicates:
            - Host=${FRONT_OFFICE_HOST:front.ec1.mateu.io}
            - Path=/**

        # ── The control console, on a host of its own ────────────────────────────────────
        #
        # A second origin rather than a path under the first, so the two consoles are two
        # Keycloak clients: a token minted for the demo console is not a token for this one,
        # and SecurityConfig can demand the `ai-admin` realm role here without touching the demo.
        #
        # Every route above names the demo host explicitly, so nothing falls through to here
        # by accident and nothing here is reachable from there.
        - id: ia-control-plane
          uri: ${IA_CONTROL_PLANE_URL:http://ia-control-plane:8110}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_ia-cp/**

        # The GitOps webhook. NOT under /_ia-cp — that prefix is the Mateu UI namespace and carries
        # the ai-admin rule, which GitHub cannot satisfy with a token it does not have. This is a
        # plain REST endpoint that authenticates itself by HMAC over the body, exactly like the
        # engine's /workflow/webhooks receiver, so it needs a route of its own and no role. Public
        # is the point: a merge in the config repo has to be able to reach it.
        # The integration's control plane (PoC ACL): the hotels' integrations, the mapping — causes,
        # dictionary, proposals — and the notifications. On the control host, behind ai-admin, like
        # the rest of it. Only the screens: integrations-service's REST API hands the connector a
        # secret, and has no route here on purpose.
        - id: integrations
          uri: ${INTEGRATIONS_URL:http://integrations-service:8126}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_integrations/**

        # The demo's administration: reset it to zero (the engine's reset-demo) and simulate an Opera
        # outage. Served by integrations-service, on the control host behind ai-admin.
        - id: demo
          uri: ${INTEGRATIONS_URL:http://integrations-service:8126}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_demo/**

        - id: mapping
          uri: ${MAPPING_URL:http://mapping-service:8122}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_mapping/**

        - id: customer-mdm
          uri: ${CUSTOMER_MDM_URL:http://customer-mdm-service:8127}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_mdm/**

        - id: audit
          uri: ${AUDIT_URL:http://audit-service:8129}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_audit/**

        - id: communication
          uri: ${COMMUNICATION_URL:http://communication-service:8125}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_communication/**

        - id: ia-control-plane-webhooks
          uri: ${IA_CONTROL_PLANE_URL:http://ia-control-plane:8110}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/cp-webhooks/**

        # The engines' administration UIs, served by the very same orchestrator and forms pods
        # that answer /_workflow and /_forms on the demo host. Each engine declares a second @UI
        # on its own base URL, so the definitions and the form editor can be mounted here while
        # processes and task lists stay where the work is done.
        #
        # Two routes rather than reusing the demo host's, because the host is what decides the
        # rule: on this one SecurityConfig requires ai-admin, and it can do that without touching
        # the demo console because the paths are different segments — /_workflow-admin is not
        # matched by /_workflow/**.
        - id: orchestrator-admin
          uri: ${ORCHESTRATOR_URL:http://orchestrator:8105}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_workflow-admin/**

        # Agent choices for the native workflow editor, metadata only. Resolved credentials stay
        # on the registry's authenticated internal API.
        - id: workflow-agent-catalogue
          uri: ${ORCHESTRATOR_URL:http://orchestrator:8105}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/api/workflow-agents

        - id: forms-admin
          uri: ${FORMS_URL:http://forms:8106}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io},${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/_forms-admin/**

        # Note what is NOT routed: /internal/**, the control plane's own endpoint that serves a
        # resolved agent configuration with its API key in the clear. It is reachable only
        # inside the cluster, and a route for it here would publish every credential this
        # deployment holds.

        - id: control-shell
          uri: ${CONTROL_SHELL_URL:http://control-shell:8111}
          predicates:
            - Host=${CONTROL_HOST:console.ec1.mateu.io}
            - Path=/**

        - id: control-shell-redwood
          uri: ${CONTROL_SHELL_REDWOOD_URL:http://control-shell-redwood:8112}
          predicates:
            - Host=${RW_CONTROL_HOST:rw-console.ec1.mateu.io}
            - Path=/**

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are fetched over the cluster network, so the gateway does not depend on its own
          # ingress, on public DNS or on a certificate having been issued yet.
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/ec-demo1/protocol/openid-connect/certs}
          # The issuer as it appears in the token — the public URL, because that is what Keycloak
          # was told its hostname is. Setting both properties means Spring validates the issuer
          # while still taking the keys from jwk-set-uri, and never performs OIDC discovery at
          # startup — which would otherwise make this pod's readiness depend on Keycloak's.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.ec1.mateu.io/realms/ec-demo1}

management:
  endpoints:
    web:
      exposure:
        # Not `gateway`: that endpoint can add routes and refresh them, and a route is a proxy to
        # anywhere this pod can reach. Routes change by redeploying this file, nothing else.
        # SecurityConfig narrows what is left: health for the probes, prometheus only for a scraper
        # inside the cluster.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: info
