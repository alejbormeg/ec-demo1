server:
  port: 8123

spring:
  application:
    name: ec-demo1-pms-integration

  cloud:
    function:
      definition: consumeWorkerEvent
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
          # A binding asking for more partitions than its topic has (consumeWorkerEvent's concurrency)
          # grows the topic: partitions are only ever added.
          auto-add-partitions: true
          # Every consumer continues the trace its record carries (traceparent header), and every
          # record sent carries the trace it was sent in: a task runs inside its process's trace, and
          # what it tells the front office and the pms-fo integration goes on in it.
          enable-observation: true
        bindings:
          notifications:
            producer:
              sync: true
          notificationResolutions:
            producer:
              sync: true
          frontOfficeCommands:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          pmsReservations:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        # IN: the engine's tasks for this adapter — the steps whose definition says topic
        # pms-integration, or whose task contract does. consumeWorkerEvent is the engine's worker
        # runtime (worker-kafka): it runs each task by its contract, <id>@<version>, on the handler
        # registered for it (worker.PmsTasks), and answers the engine. The group is the one the
        # hand-written consumer had, so it goes on from the same offsets.
        consumeWorkerEvent-in-0:
          destination: pms-integration
          group: ec-demo1-pms-integration-worker
          consumer:
            # Three at a time: every reservation's projection goes through here and its steps wait
            # on Opera; one thread would queue a backfill behind each call. The topic is grown
            # to three partitions (auto-add-partitions, above). What must not run at once is kept
            # apart by the engine's LOCK on the reservation, not by the partition.
            concurrency: 3
        # OUT: replies to the engine, and the alarm when a write keeps failing.
        upstream:
          destination: upstream
        notifications:
          destination: notifications
        notificationResolutions:
          destination: notification-resolutions
        # OUT: a reservation was written into Opera — for whoever consumes the PMS (the pms-fo integration).
        pmsReservations:
          destination: pms-reservations
        # OUT: the stays of the hotel's front office, as Opera holds them («proyectar-estancia», pms-fo).
        frontOfficeCommands:
          destination: front-office-commands

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9192}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

# Opera, through OHIP: what is written the same way for every property. How to reach each property
# — gateway, application key, client, secret, enterprise — is each hotel's integration's, read from
# integrations-service; nothing about a tenant is configuration here.
ohip:
  # The context of the CRS locator in a reservation's external references. In ec1 it comes from the
  # ec-demo-run ConfigMap, a new one each time the demo is put back to zero (deploy/demo/zero.sh).
  external-system-code: ${OPERA_EXTERNAL_SYSTEM:ECDEMO1}
  # OPERA names its UDFs UDFN01…UDFN40: which one carries the CRS version is the tenant's to say.
  version-udf: ${OPERA_VERSION_UDF:CRS_VERSION}
  pay-at-hotel-method: ${OPERA_PAY_AT_HOTEL_METHOD:CA}
  timeout: 30s
  crm-external-system: ${OPERA_CRM_EXTERNAL_SYSTEM:CRM}
  profile-references: ${OPERA_PROFILE_REFERENCES:true}
  post-deposits: ${OPERA_POST_DEPOSITS:true}
  # The chain's properties, when the tenant does not list them (a client without hub access): each is
  # read on its own for its name, and one this connection cannot read is not offered.
  known-properties: ${OPERA_PROPERTIES:}
  # Opera's «Custom Reference» on every reservation written: a filter in Opera's reservation search.
  custom-reference: ${OPERA_CUSTOM_REFERENCE:EC-DEMO1}
  # The cashier the check-outs and the folios are made with (XMAR: 69721441). OPERA uses the user's own
  # when none is sent, and the integration's user has none (FOF00094). Empty: none sent.
  cashier-id: ${OPERA_CASHIER_ID:}
  # The demo's simulated outage («Opera no responde», control plane → Demo): how long each call waits
  # before failing as a timeout while it is on.
  outage-delay: ${OPERA_OUTAGE_DELAY:5s}
  # The Opera transaction code of each charge the front office posts (registrar-cargo), by
  # <KIND>:<front office code> or <KIND> (config/ChargeCodes). XMAR's, from its transaction codes a
  # user may post by hand: 1200 supplement (late check-out), 1402 drinks (minibar), 1403 food (room
  # service, dinner), 1516 laundry, 1851 miscellaneous services (anything else).
  charges:
    default-code: ${OPERA_CHARGE_DEFAULT_CODE:1851}
    codes:
      LATE_CHECK_OUT: "1200"
      "[ADD_ON:late]": "1200"
      "[CONSUMPTION:MB-02]": "1402"
      "[CONSUMPTION:RS-01]": "1403"
      "[ADD_ON:cena]": "1403"
      "[CONSUMPTION:LAU-04]": "1516"
  # The Opera payment method of each payment the front office's till posts (registrar-cobro), by how
  # the guest paid (config/PaymentMethods). XMAR's: CASH, BT (bank transfer), VI, MC, VI/OL (Visa manual).
  payments:
    default-method: ${OPERA_PAYMENT_DEFAULT_METHOD:CASH}
    methods:
      CASH: CASH
      MANUAL: CASH
      TRANSFER: BT
      CARD_PINPAD: ${OPERA_PAYMENT_CARD_METHOD:VI}
      PAY_LINK: ${OPERA_PAYMENT_LINK_METHOD:VI/OL}

pms-integration:
  crs-integration-url: ${CRS_INTEGRATION_URL:http://localhost:8121}
  mapping-url: ${MAPPING_URL:http://localhost:8122}
  integrations-url: ${INTEGRATIONS_URL:http://localhost:8126}
  customer-mdm-url: ${CUSTOMER_MDM_URL:http://localhost:8127}
  # Opera's cancellation codes that mean a no-show, for the front office's stays (pms-fo).
  no-show-cancellation-codes: ${OPERA_NO_SHOW_CODES:NOSHOW}
  alert-after: ${RETRY_ALERT_AFTER:10m}
  # Where reset-demo's new Opera context is kept: the ec-demo-run ConfigMap through the Kubernetes API
  # (true in the cluster), or nowhere — memory only — locally.
  run-config:
    kubernetes: ${RUN_CONFIG_KUBERNETES:false}
  # reset-demo's cancel-earlier-runs: the properties it cleans besides the integrations' (a fresh
  # environment has none, and Opera keeps what other environments wrote), and the reason it cancels with.
  demo:
    cleanup-properties: ${OPERA_CLEANUP_PROPERTIES:}
    cleanup-reason: ${OPERA_CLEANUP_REASON:OTROS}

management:
  # Traces to Tempo, as the engine's. Sampled at 0 unless TRACING_SAMPLING says otherwise (1.0 in
  # the cluster); the service name comes from OTEL_SERVICE_NAME, set in the manifest.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
