server:
  port: 8121

spring:
  application:
    name: ec-demo1-crs-integration

  cloud:
    function:
      definition: consumeCrsEvents;routeIntegrationEvents;consumeWorkerEvent;consumeCustomerEvents;consumeProjectionRequests;consumeNoShowReports
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
          # Every consumer continues the trace its record carries (traceparent header), and every
          # record sent carries the trace it was sent in: the engine's tasks run inside the process's
          # trace, and what the CRS publishes reaches the engine in the booking's.
          enable-observation: true
        bindings:
          # The outbox's bindings are synchronous, so a message is marked published only once the
          # broker acknowledged it, and keyed with a String.
          integrationEvents:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          outboxUpstream:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          bookingCommands:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          partnerCommands:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        # IN: what happened in the CRS (booking) and the master of partners (partners).
        consumeCrsEvents-in-0:
          destination: crs-bookings,partners
          group: ec-demo1-crs-integration-inbox
          # Retried until it goes: after the binder's default three attempts the event would be
          # dropped (there is no DLQ), and the inbox makes the redeliveries harmless.
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # IN: the integration's business events, to be routed to processes. The router consumes
        # what the inbox half publishes: two stages, so the business event stays visible on the bus
        # and the routing table can change without touching the translation.
        routeIntegrationEvents-in-0:
          destination: integration-events
          group: ec-demo1-crs-integration-router
          # Retried until it goes: after the binder's default three attempts the event would be
          # dropped (there is no DLQ), and the inbox makes the redeliveries harmless.
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # IN: what the MDM says about a customer — a changed golden record, a merge: its reservations
        # are projected again, so Opera's guest profile is written from the MDM.
        consumeCustomerEvents-in-0:
          destination: customers
          group: ec-demo1-crs-integration-customers
          # Retried until it goes: a projection the MDM asked for is not dropped on a passing failure.
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # IN: the reservations the integrations service's backfill asks to project — a command, through
        # its outbox, never HTTP. Retried until it goes; the router's inbox takes each once.
        consumeProjectionRequests-in-0:
          destination: projection-requests
          group: ec-demo1-crs-integration-projections
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # IN: what the hotels report as no-shows — the front office, through its outbox, never HTTP.
        # Retried until it goes; the inbox takes each once.
        consumeNoShowReports-in-0:
          destination: no-show-reports
          group: ec-demo1-crs-integration-no-shows
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # IN: the engine's tasks for this adapter — the steps whose definition says topic
        # crs-integration, or whose task contract does. consumeWorkerEvent is the engine's worker
        # runtime (worker-kafka): it runs each task by its contract, <id>@<version>, on the handler
        # registered for it (worker.CrsTasks), and answers the engine. The group is the one the
        # hand-written consumer had, so it goes on from the same offsets.
        consumeWorkerEvent-in-0:
          destination: crs-integration
          group: ec-demo1-crs-integration-worker
          consumer:
            # «crs-integration» has one partition; its two steps only write a command to the outbox.
            concurrency: 1
        # OUT: business events (outbox), process starts (outbox), and replies to the engine.
        integrationEvents:
          destination: integration-events
        outboxUpstream:
          destination: upstream
        upstream:
          destination: upstream
        # OUT, through the outbox: what the steps write back to the systems this adapter fronts — the
        # PMS reference to the CRS, a partner's PMS profile to the ERP. Commands, never HTTP.
        bookingCommands:
          destination: booking-commands
        partnerCommands:
          destination: partner-commands

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/crs_integration}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9192}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

crs:
  booking-url: ${BOOKING_URL:http://localhost:8108}
  partners-url: ${ERP_URL:http://localhost:8120}
  # A reservation of a hotel with no integration starts no process (Integrations).
  integrations-url: ${INTEGRATIONS_URL:http://localhost:8126}
  # Business event → process definition (ec-definitions). A new use case is a line here and a
  # definition there, not code.
  routes:
    reservation-created: proyectar-reserva
    reservation-modified: proyectar-reserva
    reservation-cancelled: proyectar-cancelacion
    partner-changed: proyectar-interlocutor

management:
  # Traces to Tempo, as the engine's. Sampled at 0 unless TRACING_SAMPLING says otherwise (1.0 in
  # the cluster); the service name comes from OTEL_SERVICE_NAME, set in the manifest.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
