# CRS-PMS integration PoC (docs/poc-acl). Tells people about the integration's notifications — in their
# inbox, their browsers, the Google Chat spaces and by e-mail through the postfix relay (11-postfix.yaml)
# — as the recipients table says (Notifications → Recipients on the control console), keeps the history,
# and serves the inbox. Nothing here says who hears of what: an empty table is seeded with the ai-admin
# role's inbox and browsers, both chat spaces, and the urgent ones e-mailed to DEFAULT_RECIPIENT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-service
  namespace: ec-demo1
  labels: { app: communication-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: communication-service }
  template:
    metadata:
      labels:
        app: communication-service
        app.kubernetes.io/component: communication-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8125"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: communication-service
          image: miguelperezcolom/ec-demo1-communication-service:0.72.0
          env:
            # Traces to Tempo, the one the engine exports to: a booking's trace runs from the CRS through
            # this service and the orchestrator (docs: deploy/observability, "Trazas de una reserva").
            - name: OTEL_SERVICE_NAME
              value: communication
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8125"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/communication
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            # The two Google Chat spaces recipients can post to (1 and 2). A webhook URL carries a key
            # and a token: from a Secret (ec-googlechat), never from here. Optional, each one.
            - name: GOOGLE_CHAT_WEBHOOK
              valueFrom: { secretKeyRef: { name: ec-googlechat, key: GOOGLE_CHAT_WEBHOOK, optional: true } }
            - name: GOOGLE_CHAT_WEBHOOK_2
              valueFrom: { secretKeyRef: { name: ec-googlechat, key: GOOGLE_CHAT_WEBHOOK_2, optional: true } }
            # Web Push, to the browsers that allowed notifications. The VAPID keys
            # sign what is sent; the private one is a secret (ec-webpush, from
            # ~/.config/ec-demo1/webpush.env). Without them, no browser is notified.
            - name: VAPID_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: ec-webpush, key: VAPID_PUBLIC_KEY, optional: true } }
            - name: VAPID_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: ec-webpush, key: VAPID_PRIVATE_KEY, optional: true } }
            - name: VAPID_SUBJECT
              valueFrom: { secretKeyRef: { name: ec-webpush, key: VAPID_SUBJECT, optional: true } }
            - name: DB_POOL_SIZE
              value: "6"
            - name: SMTP_HOST
              value: "postfix"
            - name: SMTP_PORT
              value: "25"
            - name: MAIL_FROM
              value: "integration@ec1.mateu.io"
            - name: DEFAULT_RECIPIENT
              value: "integration-admins@example.com"
          ports:
            - { name: http, containerPort: 8125 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "640Mi", cpu: "100m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8125 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8125 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: communication-service
  namespace: ec-demo1
  labels: { app: communication-service }
spec:
  selector: { app: communication-service }
  ports:
    - { name: http, port: 8125, targetPort: 8125 }
