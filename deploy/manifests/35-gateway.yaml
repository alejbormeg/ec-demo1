# The gateway — one entry point for both consoles, and the only thing that checks a token before
# the backends see a request.
#
# The ingress hands it every path on ec1.mateu.io. It routes /_workflow, /_forms,
# /_booking, /_content and /_users to the apps that own them, /ai to the chat agent, and
# everything else to the shell — and it rejects unauthenticated calls to all six, which is what
# none of those apps can do for itself: the two engine apps speak only HTTP basic auth and the
# four demo services have no security at all. See gateway/.../SecurityConfig.java for what stays
# public and why.
#
# It also serves console.ec1.mateu.io, the control console, where it additionally requires the
# `ai-admin` realm role — that host reaches the LLM credentials, and this is the only place that
# requirement is written. Kept distinct from the demo console's `admin` so that reaching the AI
# credentials and driving workflows are separate grants, neither implying the other.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ec-demo1
  labels: { app: gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/component: gateway
      annotations:
        # Karpenter does not move it to consolidate nodes: a restart under a demo is an outage.
        karpenter.sh/do-not-disrupt: "true"
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8190"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: miguelperezcolom/ec-demo1-gateway:0.76.0
          env:
            - name: SERVER_PORT
              value: "8190"
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:8105
            - name: FORMS_URL
              value: http://forms:8106
            - name: SHELL_URL
              value: http://shell:8101
            - name: BOOKING_URL
              value: http://booking:8108
            - name: CONTENT_URL
              value: http://content:8104
            - name: USERS_URL
              value: http://users:8102
            - name: IA_AGENT_URL
              value: http://ia-agent:8095
            # The two consoles. Every route names one of these explicitly, so nothing falls
            # through from one host to the other, and SecurityConfig reads CONTROL_HOST for the
            # ai-admin-role rule — the value has to be the host a browser actually asks for.
            - name: CONSOLE_HOST
              value: ec1.mateu.io
            - name: CONTROL_HOST
              value: console.ec1.mateu.io
            - name: IA_CONTROL_PLANE_URL
              value: http://ia-control-plane:8110
            - name: CONTROL_SHELL_URL
              value: http://control-shell:8111
            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/ec-demo1/protocol/openid-connect/certs
            - name: KEYCLOAK_ISSUER_URI
              value: https://auth.ec1.mateu.io/realms/ec-demo1
          ports:
            - { name: http, containerPort: 8190 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            # Every request to the console crosses it, so under load it is on the hot path.
            requests: { memory: "768Mi", cpu: "500m" }
            limits:   { memory: "2Gi",   cpu: "2" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8190 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8190 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ec-demo1
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports:
    - { name: http, port: 8190, targetPort: 8190 }
