# CRS-PMS integration PoC (docs/poc-acl). The integrations: one per hotel, with its connection to Opera
# (secret sealed at rest under the key in ec-integrations-crypto) and its life, from onboarding —
# connectivity, catalogue contrast, mapping, partners, backfill — to activation, pause and
# decommission; the worker of «alta-integracion», the MCP tools, and the screens at /_integrations
# on the control console — and the demo's administration (/_demo, the steps of reset-demo it serves). Its REST API is not routed by the gateway: /integrations/connections hands
# the connector the secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrations-service
  namespace: ec-demo1
  labels: { app: integrations-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: integrations-service }
  template:
    metadata:
      labels:
        app: integrations-service
        app.kubernetes.io/component: integrations-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8126"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: integrations-service
          image: miguelperezcolom/ec-demo1-integrations-service:0.75.0
          env:
            # Traces to Tempo, the one the engine exports to: a booking's trace runs from the CRS through
            # this service and the orchestrator (docs: deploy/observability, "Trazas de una reserva").
            - name: OTEL_SERVICE_NAME
              value: integrations
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8126"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/integrations
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "6"
            - name: CRS_INTEGRATION_URL
              value: "http://crs-integration-service:8121"
            - name: PMS_INTEGRATION_URL
              value: "http://pms-integration-service:8123"
            - name: MAPPING_URL
              value: "http://mapping-service:8122"
            # The demo asks the mapping agent live, from Mapping → Dictionary: the gate leaves a notice instead.
            - name: INTEGRATIONS_MAPPING_ASK_AGENT
              value: "false"
            - name: ERP_URL
              value: "http://erp:8120"
            # The pms-fo integrations: the front office they feed, how far ahead their window reaches
            # (backfill and polling) and how often Opera is polled for what changed there.
            - name: FRONT_OFFICE_URL
              value: "http://front-office:8128"
            # The external APIs' usage in the consoles' header: who counts Salesforce's calls (the MDM)
            # and Opera's (the connector, PMS_INTEGRATION_URL above, by default). /usage is in-cluster only.
            - name: USAGE_SALESFORCE_URLS
              value: "http://customer-mdm-service:8127"
            - name: FO_HORIZON_DAYS
              value: "60"
            - name: FO_POLL
              value: "60s"
            # The chain's connection to Opera: what a new integration starts from. OHIP UAT, from the
            # ec-opera Secret (deploy.sh, from credentials.env) — never in the repo.
            - name: OPERA_GATEWAY_URL
              valueFrom: { secretKeyRef: { name: ec-opera, key: OPERA_GATEWAY_URL } }
            - name: OPERA_APP_KEY
              valueFrom: { secretKeyRef: { name: ec-opera, key: OPERA_APP_KEY } }
            - name: OPERA_CLIENT_ID
              valueFrom: { secretKeyRef: { name: ec-opera, key: OPERA_CLIENT_ID } }
            - name: OPERA_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: ec-opera, key: OPERA_CLIENT_SECRET } }
            - name: OPERA_ENTERPRISE_ID
              valueFrom: { secretKeyRef: { name: ec-opera, key: OPERA_ENTERPRISE_ID } }
            - name: INTEGRATIONS_CRYPTO_KEY
              valueFrom: { secretKeyRef: { name: ec-integrations-crypto, key: INTEGRATIONS_CRYPTO_KEY } }
            - name: CONSOLE_URL
              value: "https://console.ec1.mateu.io"
            # The demo's administration (control console → Demo, /_demo): the reset-demo runs are read from
            # the engine's database, and purge-engine empties it but for the reset that asks; the
            # health check after a reset asks each of these; the process pages are on the data console.
            - name: ENGINE_DB_URL
              value: jdbc:postgresql://postgres:5432/workflow
            - name: DATA_CONSOLE_URL
              value: "https://ec1.mateu.io"
            - name: BOOKING_URL
              value: "http://booking:8108"
            - name: DEMO_HEALTH
              value: >-
                booking=http://booking:8108/actuator/health/readiness,erp=http://erp:8120/actuator/health/readiness,crs-integration=http://crs-integration-service:8121/actuator/health/readiness,mapping=http://mapping-service:8122/actuator/health/readiness,pms-integration=http://pms-integration-service:8123/actuator/health/readiness,communication=http://communication-service:8125/actuator/health/readiness,customer-mdm=http://customer-mdm-service:8127/actuator/health/readiness,front-office=http://front-office:8128/actuator/health/readiness,audit=http://audit-service:8129/actuator/health/readiness,notices=http://notices:8131/actuator/health/readiness,customer-history=http://customer-history:8133/actuator/health/readiness,loyalty=http://loyalty:8134/actuator/health/readiness,registration-rules=http://registration-rules:8132/actuator/health/readiness,orchestrator=http://orchestrator:8105/actuator/health,forms=http://forms:8106/actuator/health
          ports:
            - { name: http, containerPort: 8126 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "640Mi", cpu: "100m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8126 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8126 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: integrations-service
  namespace: ec-demo1
  labels: { app: integrations-service }
spec:
  selector: { app: integrations-service }
  ports:
    - { name: http, port: 8126, targetPort: 8126 }
