# A customer's stays in the chain (historial de clientes), a data-plane system: one row per closed stay
# and customer, taken from the front office's StayClosed (front-office-events), by the MDM's customer code;
# the MDM's merges (customers) are kept as aliases, so a customer's summary includes the stays of the codes
# merged into it. The front office reads GET /customers/{code}/summary at the check-in; the head office has
# the screens (/_history, "Historial de clientes"). First piece of the "vista 360".
# Its database lives in the engine's Postgres, like the other services' (55-demo-db-init creates it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-history
  namespace: ec-demo1
  labels: { app: customer-history }
spec:
  replicas: 1
  selector:
    matchLabels: { app: customer-history }
  template:
    metadata:
      labels:
        app: customer-history
        app.kubernetes.io/component: customer-history
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8133"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: customer-history
          image: miguelperezcolom/ec-demo1-customer-history:0.76.0
          env:
            - name: OTEL_SERVICE_NAME
              value: customer-history
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8133"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/customer_history
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "4"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            # A partner notice carries the partner's name, as the ERP has it: how the PMS names the agency.
          ports:
            - { name: http, containerPort: 8133 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "384Mi", cpu: "50m" }
            limits:   { memory: "768Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8133 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8133 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: customer-history
  namespace: ec-demo1
  labels: { app: customer-history }
spec:
  selector: { app: customer-history }
  ports:
    - { name: http, port: 8133, targetPort: 8133 }
