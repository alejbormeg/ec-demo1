# The content service — content, labels and content types, as a Mateu CRUD at /_content.
#
# It talks to nothing but its own database. The version this was ported from declared a Kafka
# binder and three bindings under the engine's own consumer group names, and implemented none of
# them; that was removed rather than deployed, so there is no broker dependency here and no
# initContainer waiting for one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content
  namespace: ec-demo1
  labels: { app: content }
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate.
  #
  # A rolling update of a one-replica Deployment surges to two pods, and the nodes may have no
  # room for a second copy of this one: Karpenter answers with "no instance type met all
  # requirements" when another node would ask the fleet for more vCPU than its limit allows, so
  # the new pod sits Pending forever while the old one keeps serving. That is the failure the
  # README warns about, and it reads like a scheduling bug rather than the quota it is.
  #
  # Recreate stops the old pod first, so only one is ever scheduled. The cost is a few seconds of
  # 503 on every deploy of this service, which is the right trade for a demo CRUD and the wrong one
  # for anything that has to stay up — raise the fleet limit through the Fleet API instead if this
  # ever needs to be zero-downtime.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: content }
  template:
    metadata:
      labels:
        app: content
        app.kubernetes.io/component: content
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8104"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: content
          image: miguelperezcolom/ec-demo1-content:0.71.0
          env:
            - name: SERVER_PORT
              value: "8104"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/content
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "8"
          ports:
            - { name: http, containerPort: 8104 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "768Mi", cpu: "250m" }
            limits:   { memory: "2Gi",   cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8104 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8104 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: content
  namespace: ec-demo1
  labels: { app: content }
spec:
  selector: { app: content }
  ports:
    - { name: http, port: 8104, targetPort: 8104 }
