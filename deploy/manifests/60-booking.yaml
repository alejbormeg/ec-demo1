# The booking service — the CRS.
#
# Three things live in this one pod:
#   • a Mateu CRUD at /_booking, which the shell hosts as a remote menu;
#   • an MCP server, which is where the chat agent's booking tools come from;
#   • a worker for the engine: it consumes the `booking` topic and replies on `upstream` — today
#     registrar-no-show's register-no-show step, which cancels a booking as a no-show.
#
# A new booking is born confirmed, with its payments, as one change: one booking-created on
# crs-bookings and one proyectar-reserva. (The verify-booking-payment process that used to confirm
# it afterwards, doubling every projection, is gone.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: ec-demo1
  labels: { app: booking }
spec:
  replicas: 1
  selector:
    matchLabels: { app: booking }
  template:
    metadata:
      labels:
        app: booking
        app.kubernetes.io/component: booking
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8108"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Both, because this one is a Kafka consumer as well as a JPA application: without the
        # broker its binder retries in a loop that looks like a healthy pod doing nothing.
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: booking
          image: miguelperezcolom/ec-demo1-booking:0.71.0
          env:
            # Traces to Tempo, the one the engine exports to: a booking's trace runs from the CRS through
            # this service and the orchestrator (docs: deploy/observability, "Trazas de una reserva").
            - name: OTEL_SERVICE_NAME
              value: booking
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8108"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            # Its own database, created by 55-demo-db-init.yaml. Not the engine's `workflow`:
            # this service creates its table with ddl-auto and Flyway owns the schema there.
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/booking
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            # The AI agents' read-only SQL runs as this login, which reads only the agent views.
            - name: AGENT_DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-agent-reader, key: AGENT_DB_USERNAME } }
            - name: AGENT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-agent-reader, key: AGENT_DB_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "8"
            # The ERP's master of partners, read by "+ 10 demo bookings" for the TTOO/OTA channels.
            - name: ERP_URL
              value: "http://erp:8120"
            # The customer MDM: who a booking's people are in Clientes, Salesforce, Opera and the
            # front office, for the booking's page to link to. Read-only, and only for showing.
            - name: CUSTOMER_MDM_URL
              value: "http://customer-mdm-service:8127"
            # A booking's history, as the audit service keeps it: who did what with it (GET /audit).
            - name: AUDIT_URL
              value: "http://audit-service:8129"
          ports:
            - { name: http, containerPort: 8108 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "768Mi", cpu: "250m" }
            limits:   { memory: "2Gi",   cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8108 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8108 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: ec-demo1
  labels: { app: booking }
spec:
  selector: { app: booking }
  ports:
    - { name: http, port: 8108, targetPort: 8108 }
