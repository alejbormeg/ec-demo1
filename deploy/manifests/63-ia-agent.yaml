# The chat agent behind every console's chat panel — the data plane's, the control plane's and the
# front office's. One deployment for all of them: which agent answers a prompt is not this pod's to
# know. The gateway stamps each console's route with X-Agent-Channel (data-plane, control-plane,
# front-office) and X-Default-Agent (console-agent, control-plane-agent, reception-agent), and the
# control plane's routes may pick another agent by screen, role, locale, tenant or channel.
#
# It implements no screens, holds no database, and — since the control plane exists — holds no
# configuration either. A prompt arrives at /ai/api/agent/stream; this pod asks the control plane
# which model, which credential, which system prompt and which MCP servers, opens a fresh
# connection to each of those servers, hands the LLM whatever tools they advertise, and streams
# the answer back.
#
# So there is exactly one thing it knows about itself, and it is the only variable below that is not
# plumbing: where the control plane is.
#
# A connection per prompt, and not a pool, deliberately — Spring AI's auto-configured MCP client
# holds one persistent SSE connection and stays broken for the life of the pod once it drops.
#
# Three things to know before this is running in front of anyone:
#   • Every prompt is billed to whatever credential the control plane serves. The gateway requires
#     a Keycloak token on /ai/**, which is what keeps that from being an open endpoint.
#   • Its readiness follows the control plane: a pod that has never reached it reports DOWN and
#     stays out of the Service's endpoints, because it has no model to answer with. Losing the
#     control plane *later* does not do that — each agent's last good configuration keeps being
#     served and the pod reports UP with a `degraded` detail.
#   • The Anthropic key is no longer here. It lives in the control plane's catalogue, encrypted,
#     and reaches this pod per prompt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-agent
  namespace: ec-demo1
  labels: { app: ia-agent }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ia-agent }
  template:
    metadata:
      labels:
        app: ia-agent
        app.kubernetes.io/component: ia-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8095"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ia-agent
          image: miguelperezcolom/ec-demo1-ia-agent:0.76.0
          env:
            - name: SERVER_PORT
              value: "8095"
            # Reached over the cluster network rather than through the gateway: this is
            # pod-to-pod, carries no user token, and /internal/** has no gateway route at all.
            - name: IA_CONTROL_PLANE_URL
              value: http://ia-control-plane:8110
            # Traces to Tempo, like the engines'. One span per prompt (invoke_agent <agent>), one
            # per model round trip (chat <model>) and one per tool call (execute_tool <tool>), with
            # the agent, the model, the tokens, the durations and the tools. The trace continues
            # into the MCP servers and the control plane that trace.
            - name: OTEL_SERVICE_NAME
              value: ia-agent
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            # What the traces keep of the conversation: none | redacted | full (code default: none).
            # `full` because this is a DEMO environment: the user's message and the answer, every
            # message sent to the model and its reply, and each tool's arguments and result go
            # into Tempo as they are — customer data (names, e-mails, phones, bookings) kept there
            # for Tempo's retention (24h here) and readable by anyone with Grafana. For real data
            # use `redacted`, which masks e-mails, phones, cards, IBANs, DNI/NIE and passports
            # before export — names and addresses it cannot recognise — or `none`.
            - name: IA_CAPTURE_CONTENT
              value: full
          ports:
            - { name: http, containerPort: 8095 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "512Mi", cpu: "200m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8095 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8095 }
            initialDelaySeconds: 60
            periodSeconds: 20
            # A prompt can hold a thread for a minute while it waits on the LLM; liveness has to
            # mean "wedged", never "busy".
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: ia-agent
  namespace: ec-demo1
  labels: { app: ia-agent }
spec:
  selector: { app: ia-agent }
  ports:
    - { name: http, port: 8095, targetPort: 8095 }
