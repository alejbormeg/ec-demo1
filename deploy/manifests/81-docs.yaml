# The documentation site (doc/, Astro + Starlight) at doc.ec1.mateu.io: static files served by an
# unprivileged nginx. Owns no data and calls nothing.
#
# Behind a username and password at the ingress (basic auth): the site describes the whole
# deployment — hosts, services, how the integration works — and is not meant for the public. The
# users are `riu` and `oracle` (for Oracle's people); their passwords are generated by deploy.sh into
# deploy/.secrets/credentials.env (DOCS_PASSWORD, DOCS_ORACLE_PASSWORD) and put, one htpasswd line
# each, into the docs-basic-auth Secret — never in git. The
# pages also carry <meta name="robots" content="noindex">.
#
# No DNS to add: the *.ec1 wildcard already points at the ingress, and cert-manager issues the
# certificate by HTTP-01 the first time the name resolves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: ec-demo1
  labels: { app: docs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: docs }
  template:
    metadata:
      labels:
        app: docs
        app.kubernetes.io/component: docs
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: docs
          image: miguelperezcolom/ec-demo1-docs:0.4.16
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits:   { memory: "64Mi", cpu: "250m" }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: ec-demo1
  labels: { app: docs }
spec:
  selector: { app: docs }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  namespace: ec-demo1
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # A username and password in front of the whole site (see the header). The Secret is created by
    # deploy.sh only if it does not exist, from DOCS_PASSWORD in deploy/.secrets/credentials.env.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: docs-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "ec-demo1 docs"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [doc.ec1.mateu.io]
      secretName: docs-tls
  rules:
    - host: doc.ec1.mateu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: docs, port: { number: 80 } } }
