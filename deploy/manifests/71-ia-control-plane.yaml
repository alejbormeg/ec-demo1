# The IA control plane — the four catalogues the chat agent is configured from.
#
# Two surfaces on one pod, and the difference between them matters:
#
#   /_ia-cp/**    the Mateu UI, hosted by the control shell as a remote menu. Routed by the
#                 gateway, on the control host only, behind the `ai-admin` realm role.
#   /internal/**  a resolved agent configuration, API key in the clear. This is what `ia-agent`
#                 reads on every prompt — it is the only source of its model, credential, system
#                 prompt and MCP list. NOT routed by the gateway and it must never be: there is
#                 no route for it, and adding one would publish every credential here.
#
# The second is protected by that absence and by the Service being cluster-internal. It
# authenticates nothing itself — the same arrangement as the users service's gRPC port, and the
# same warning applies with more force.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-control-plane
  namespace: ec-demo1
  labels: { app: ia-control-plane }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ia-control-plane }
  template:
    metadata:
      labels:
        app: ia-control-plane
        app.kubernetes.io/component: ia-control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8110"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-cp-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z cp-postgres 5432; do echo waiting for cp-postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: ia-control-plane
          image: miguelperezcolom/ec-demo1-ia-control-plane:0.76.0
          env:
            - name: SERVER_PORT
              value: "8110"
            # Traces to Tempo: the control plane's side of a prompt (resolve, RAG search, usage)
            # lands inside ia-agent's trace, which sends the trace headers on those calls.
            - name: OTEL_SERVICE_NAME
              value: ia-control-plane
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            # cp-postgres, not postgres: the control plane keeps its own server — see
            # 70-cp-postgres.yaml.
            - name: DB_URL
              value: jdbc:postgresql://cp-postgres:5432/controlplane
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-cp-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-cp-postgres, key: POSTGRES_PASSWORD } }
            # Workflow catalogue/snapshot endpoints validate the technical client's JWT directly.
            - { name: WORKFLOW_JWT_ISSUER, value: "https://auth.ec1.mateu.io/realms/ec-demo1" }
            - { name: WORKFLOW_JWT_JWK_SET_URI, value: "http://keycloak:8080/realms/ec-demo1/protocol/openid-connect/certs" }
            - { name: WORKFLOW_JWT_AUDIENCE, value: workflow-agent-executor }
            - { name: WORKFLOW_JWT_CLIENT_ID, value: workflow-agent-executor }
            - { name: WORKFLOW_A2A_BASE_URL, value: "http://ia-workflow-worker:8095" }
            # AES-256 key for the stored LLM credentials, base64 of 32 bytes. Generated once by
            # deploy.sh into deploy/.secrets/credentials.env and kept there: rotating it makes
            # every stored credential undecryptable, because nothing here re-wraps them.
            - name: CP_CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: ec-cp-crypto
                  key: CP_CRYPTO_KEY
                  # So a missing key is a running pod that says so, rather than one stuck Pending.
                  # The catalogues work without it; only the credential field refuses.
                  optional: true
            # ── Seeding, and only ever onto four empty catalogues ─────────────────────────
            #
            # These are not this service's own configuration — it calls none of them. They are
            # what CatalogueSeeder writes into the catalogues the first time it starts against an
            # empty database, so a fresh deploy.sh still produces a working chat panel now that
            # the agent takes its configuration from here. After that they are ignored and the
            # entries are the operator's to edit.
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:8105
            - name: FORMS_URL
              value: http://forms:8106
            - name: BOOKING_URL
              value: http://booking:8108
            # Where the seeded RAG source points: this pod's own database, which carries the
            # pgvector extension. The credentials are in the URL rather than separate because
            # that is the shape the catalogue stores — a RAG source is a connection string.
            - name: RAG_STORE_URL
              value: jdbc:postgresql://cp-postgres:5432/controlplane?user=$(DB_USERNAME)&password=$(DB_PASSWORD)
            # The embedding model the seeded RAG source uses: the in-cluster TEI pod. Its OpenAI
            # route; the /v1 is where OpenAiCompatibleEmbeddingModel appends /embeddings.
            - name: EMBEDDINGS_URL
              value: http://embeddings/v1
            - name: EMBEDDINGS_MODEL
              value: intfloat/multilingual-e5-small
            # The Anthropic key moved here from the agent: this is where credentials live now.
            # Absent, the seeded model is catalogued with no credential and says so in the
            # console — a better failure than the same key missing invisibly inside a pod.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ec-anthropic
                  key: ANTHROPIC_API_KEY
                  optional: true
            # GitOps: the catalogues from a GitHub repo. Off unless GITOPS_REPO names one and
            # GITOPS_ENABLED is turned on — see the cp.gitops block in application.yaml and the
            # README. The webhook secret and read token come from the cp-gitops Secret, which
            # deploy.sh creates (empty is fine: disabled needs neither).
            - name: GITOPS_ENABLED
              value: "true"
            - name: GITOPS_REPO
              value: "miguelperezcolom/ec-ia-config"
            # master, como el resto de repositorios de este proyecto — no main.
            - name: GITOPS_BRANCH
              value: master
            - name: GITOPS_PATH
              value: ia
            - name: GITOPS_POLL_ENABLED
              value: "false"
            - name: GITOPS_GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: cp-gitops, key: github-token, optional: true } }
            - name: GITOPS_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: cp-gitops, key: webhook-secret, optional: true } }
          ports:
            - { name: http, containerPort: 8110 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "768Mi", cpu: "250m" }
            limits:   { memory: "2Gi",   cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8110 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8110 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: ia-control-plane
  namespace: ec-demo1
  labels: { app: ia-control-plane }
spec:
  selector: { app: ia-control-plane }
  ports:
    - { name: http, port: 8110, targetPort: 8110 }
