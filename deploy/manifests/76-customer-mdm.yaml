# CRS-PMS integration PoC (docs/poc-acl), H11: the customer MDM (HLA CRM-MDM). Owner of the golden
# record and of identity resolution — the connector asks it who a reservation's passengers are
# before writing the guest profile — with Salesforce as its cleaning engine and stewardship surface:
# it projects customers there as contacts — marked by data quality (Estado MDM, Calidad del dato,
# Origen) — and hears merges, decisions, contact changes and notices back as platform events through
# the Pub/Sub API (outbound gRPC to api.pubsub.salesforce.com:7443, no NetworkPolicy restricts it),
# resuming from persisted replay ids; its queries under them are a daily net. Screens at /_mdm on the control
# console, and its business face — Clientes — at /_customers on the data plane. Without the ec-salesforce Secret it still resolves identities; cleaning just waits.
# What it decides about a customer — a changed golden record, a merge — it publishes on the
# `customers` topic and calls no one: the front office reads its kardex from it directly (since H14)
# and crs-integration projects the customer's reservations again for Opera. A customer's reception
# notices (Salesforce's) go out on `customer-notices`, which the notices service takes and republishes
# on `notices` with the reservation's and the agency's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-mdm-service
  namespace: ec-demo1
  labels: { app: customer-mdm-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: customer-mdm-service }
  template:
    metadata:
      labels:
        app: customer-mdm-service
        app.kubernetes.io/component: customer-mdm-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8127"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: customer-mdm-service
          image: miguelperezcolom/ec-demo1-customer-mdm-service:0.74.0
          env:
            # Traces to Tempo, the one the engine exports to: a booking's trace runs from the CRS through
            # this service and the orchestrator (docs: deploy/observability, "Trazas de una reserva").
            - name: OTEL_SERVICE_NAME
              value: customer-mdm
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8127"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/customer_mdm
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "6"
            # The customers topic, through the outbox.
            - name: KAFKA_BROKERS
              value: redpanda:19092
            # The org's External Client App, machine to machine (client credentials). Optional, like
            # the Anthropic key: bought, not derived, so only there when someone put it in.
            - name: SF_DOMAIN
              valueFrom: { secretKeyRef: { name: ec-salesforce, key: SF_DOMAIN, optional: true } }
            - name: SF_CLIENT_ID
              valueFrom: { secretKeyRef: { name: ec-salesforce, key: SF_CLIENT_ID, optional: true } }
            - name: SF_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: ec-salesforce, key: SF_CLIENT_SECRET, optional: true } }
            # Clientes (the data plane's screens, /_customers): a customer's reservations are read
            # from the CRS and its stays from the front office — both read-only — and the front
            # office's public host is where a person opens a stay. Salesforce's Lightning URL is
            # derived from SF_DOMAIN.
            - name: BOOKING_URL
              value: "http://booking:8108"
            - name: FRONT_OFFICE_URL
              value: "http://front-office:8128"
            - name: FRONT_OFFICE_PUBLIC_URL
              value: "https://front.ec1.mateu.io"
          ports:
            - { name: http, containerPort: 8127 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "640Mi", cpu: "100m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8127 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8127 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: customer-mdm-service
  namespace: ec-demo1
  labels: { app: customer-mdm-service }
spec:
  selector: { app: customer-mdm-service }
  ports:
    - { name: http, port: 8127, targetPort: 8127 }
