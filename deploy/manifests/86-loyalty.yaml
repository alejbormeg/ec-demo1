# Riu Class, the chain's loyalty programme — a DEMO of it, a data-plane system: members (number, MDM customer
# code, tier, points) and their accruals, which come from the front office's StayClosed (front-office-events);
# the MDM's merges (customers) move a member to the surviving customer. The front office reads
# GET /members/{number} or ?customerCode= at the check-in; the business has the screens (/_loyalty, "Riu
# Class") and the agents its MCP tools. When the chain's real service exists, the front office's
# LoyaltyStatus points there instead and this one goes.
# Its database lives in the engine's Postgres, like the other services' (55-demo-db-init creates it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty
  namespace: ec-demo1
  labels: { app: loyalty }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loyalty }
  template:
    metadata:
      labels:
        app: loyalty
        app.kubernetes.io/component: loyalty
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8134"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: loyalty
          image: miguelperezcolom/ec-demo1-loyalty:0.69.0
          env:
            - name: OTEL_SERVICE_NAME
              value: loyalty
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8134"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/loyalty
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "4"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            # A partner notice carries the partner's name, as the ERP has it: how the PMS names the agency.
          ports:
            - { name: http, containerPort: 8134 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "384Mi", cpu: "50m" }
            limits:   { memory: "768Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8134 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8134 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty
  namespace: ec-demo1
  labels: { app: loyalty }
spec:
  selector: { app: loyalty }
  ports:
    - { name: http, port: 8134, targetPort: 8134 }
