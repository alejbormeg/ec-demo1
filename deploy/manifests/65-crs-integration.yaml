# CRS-PMS integration PoC (docs/poc-acl). The CRS end of the integration, an anti-corruption layer: it turns
# what happens in booking and partners into business events, starts the process each calls for,
# serves the CRS's data in the integration's terms, and writes the PMS reference back. No screens.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crs-integration-service
  namespace: ec-demo1
  labels: { app: crs-integration-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: crs-integration-service }
  template:
    metadata:
      labels:
        app: crs-integration-service
        app.kubernetes.io/component: crs-integration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8121"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: crs-integration-service
          image: miguelperezcolom/ec-demo1-crs-integration-service:0.69.0
          env:
            # Traces to Tempo, the one the engine exports to: a booking's trace runs from the CRS through
            # this service and the orchestrator (docs: deploy/observability, "Trazas de una reserva").
            - name: OTEL_SERVICE_NAME
              value: crs-integration
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8121"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/crs_integration
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "6"
            - name: BOOKING_URL
              value: "http://booking:8108"
            - name: ERP_URL
              value: "http://erp:8120"
            - name: INTEGRATIONS_URL
              value: "http://integrations-service:8126"
          ports:
            - { name: http, containerPort: 8121 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "640Mi", cpu: "100m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8121 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8121 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: crs-integration-service
  namespace: ec-demo1
  labels: { app: crs-integration-service }
spec:
  selector: { app: crs-integration-service }
  ports:
    - { name: http, port: 8121, targetPort: 8121 }
