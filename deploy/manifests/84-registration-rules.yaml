# The registration rules (reglas de registro del kárdex), a control-plane service: which of a guest's
# data each destination's law requires when the hotel registers them — by the hotel's country or the
# hotel, and the guest's nationality, age and role. Governance: kept by compliance on the control
# console (/_registration-rules, "Registro de huéspedes"), every change audited, and drafted — never
# activated — by the control plane's agent (MCP). Every rule goes out whole on `registration-rules`,
# where each front office keeps its copy and applies it at check-in — so the desk still applies them
# when this service does not answer. The demo's sample rules: deploy/demo/registration-rules-seed.sh.
# Its database lives in the engine's Postgres, like the other services' (55-demo-db-init creates it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-rules
  namespace: ec-demo1
  labels: { app: registration-rules }
spec:
  replicas: 1
  selector:
    matchLabels: { app: registration-rules }
  template:
    metadata:
      labels:
        app: registration-rules
        app.kubernetes.io/component: registration-rules
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8132"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: registration-rules
          image: miguelperezcolom/ec-demo1-registration-rules:0.75.0
          env:
            - name: OTEL_SERVICE_NAME
              value: registration-rules
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8132"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/registration_rules
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "4"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            # The country of each CRS hotel, where a country's rule applies (no master has it yet).
            - name: HOTEL_COUNTRIES
              value: "MRU01=MU,PMI01=ES,CUN01=MX"
          ports:
            - { name: http, containerPort: 8132 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "384Mi", cpu: "50m" }
            limits:   { memory: "768Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8132 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8132 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: registration-rules
  namespace: ec-demo1
  labels: { app: registration-rules }
spec:
  selector: { app: registration-rules }
  ports:
    - { name: http, port: 8132, targetPort: 8132 }
