# CRS-PMS integration PoC (docs/poc-acl): the audit service (HLA F016). The read model of every
# auditable action a person takes on the control plane — who, when, which action, with what
# parameters and what it answered — materialised from the `audit` topic the integrations and
# mapping services publish to from their outboxes. Read-only. One screen at /_audit on the console.
# Its database lives in the engine's Postgres, like the other services': a demo's trail, not a
# retained one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: ec-demo1
  labels: { app: audit-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels:
        app: audit-service
        app.kubernetes.io/component: audit-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8129"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: audit-service
          image: miguelperezcolom/ec-demo1-audit-service:0.69.0
          env:
            # Traces to Tempo, the one the engine exports to: a booking's trace runs from the CRS through
            # this service and the orchestrator (docs: deploy/observability, "Trazas de una reserva").
            - name: OTEL_SERVICE_NAME
              value: audit
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8129"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/audit
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "4"
            - name: KAFKA_BROKERS
              value: redpanda:19092
          ports:
            - { name: http, containerPort: 8129 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "384Mi", cpu: "50m" }
            limits:   { memory: "768Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8129 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8129 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: ec-demo1
  labels: { app: audit-service }
spec:
  selector: { app: audit-service }
  ports:
    - { name: http, port: 8129, targetPort: 8129 }
